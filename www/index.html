<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neom Mathventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="language-switcher">
        <button class="lang-btn active" data-lang="malayalam" aria-label="Malayalam">
            മലയാളം
        </button>
        <button class="lang-btn" data-lang="manglish" aria-label="Manglish">
            Manglish
        </button>
        <button class="lang-btn" data-lang="english" aria-label="English">
            English
        </button>
    </div>

    <div class="game-container">
        <!-- Thangamma the Tapir (Female) -->
        <svg class="mascot tapir" viewBox="0 0 240 240">
            <!-- Speech Bubble -->
            <g class="speech-bubble" opacity="0">
                <path d="M20 40 L280 40 Q320 40 320 80 L320 160 Q320 200 280 200 L20 200 Q-20 200 -20 160 L-20 80 Q-20 40 20 40Z" 
                      fill="white" stroke="#21618C" stroke-width="3"/>
                <path d="M150 200 L130 230 L170 200" fill="white" stroke="#21618C" stroke-width="3"/>
                <text x="150" y="90" text-anchor="middle" class="speech-text primary-text" fill="#21618C" font-size="24">നമസ്കാരം!</text>
                <text x="150" y="130" text-anchor="middle" class="speech-text secondary-text" fill="#21618C" font-size="20">നമുക്ക് കണക്ക് പഠിക്കാം</text>
                <text x="150" y="170" text-anchor="middle" class="speech-text motivation-text" fill="#21618C" font-size="18">Let's solve together!</text>
            </g>
            
            <!-- Head with feminine features -->
            <g class="tapir-head">
                <!-- Jasmine flowers in hair -->
                <circle cx="105" cy="35" r="8" fill="white" class="jasmine"/>
                <circle cx="107" cy="37" r="3" fill="#FFD700" class="jasmine-center"/>
                <circle cx="155" cy="35" r="8" fill="white" class="jasmine"/>
                <circle cx="157" cy="37" r="3" fill="#FFD700" class="jasmine-center"/>
                
                <!-- Long-styled hair -->
                <path d="M100 40 
                         C95 45 90 55 95 65
                         C100 70 110 70 115 65" 
                      fill="#4A4A4A" stroke="#363636" stroke-width="1"/>
                
                <!-- Main head shape -->
                <path d="M110 50 
                         C110 30 150 30 170 40
                         C190 50 190 70 170 80
                         C150 90 110 70 110 50Z" 
                      fill="#E8E0D5" stroke="#4A4A4A" stroke-width="2"/>
                
                <!-- Face with feminine features -->
                <g class="mascot-face">
                    <!-- Longer eyelashes -->
                    <path d="M135 42 L138 40" stroke="#2C1810" stroke-width="1"/>
                    <path d="M140 41 L143 39" stroke="#2C1810" stroke-width="1"/>
                    <path d="M145 42 L148 40" stroke="#2C1810" stroke-width="1"/>
                    <path d="M155 42 L158 40" stroke="#2C1810" stroke-width="1"/>
                    <path d="M160 41 L163 39" stroke="#2C1810" stroke-width="1"/>
                    <path d="M165 42 L168 40" stroke="#2C1810" stroke-width="1"/>
                    
                    <!-- Slightly larger eyes -->
                    <circle cx="140" cy="45" r="5" fill="#2C1810"/>
                    <circle cx="160" cy="45" r="5" fill="#2C1810"/>
                    <circle cx="142" cy="44" r="2" fill="white"/>
                    <circle cx="162" cy="44" r="2" fill="white"/>
                    
                    <!-- Softer smile -->
                    <path class="smile" d="M145 55 Q150 61 155 55" fill="none" stroke="#2C1810" stroke-width="2"/>
                    <path class="grin" d="M140 55 Q150 65 160 55" fill="none" stroke="#2C1810" stroke-width="2" class="hidden"/>
                    <path class="compassionate" d="M145 58 Q150 55 155 58" fill="none" stroke="#2C1810" stroke-width="2" class="hidden"/>
                    <path class="very-happy" d="M140 55 Q150 70 160 55" fill="none" stroke="#2C1810" stroke-width="2" class="hidden"/>
                </g>
            </g>

            <!-- Body with traditional Kerala set mundu -->
            <g class="tapir-body">
                <!-- Torso with set mundu draping -->
                <path d="M90 100 
                         C90 80 110 70 130 70
                         C150 70 170 80 170 100
                         C170 140 150 160 130 160
                         C110 160 90 140 90 100Z" 
                      fill="#E8E0D5" stroke="#4A4A4A" stroke-width="2"/>
                
                <!-- Set mundu pleats -->
                <path d="M90 130 L170 130" stroke="#FFD700" stroke-width="4"/>
                <path d="M90 135 L170 135" stroke="#FFD700" stroke-width="2"/>
                
                <!-- Arms with bangles -->
                <path d="M85 100 C75 110 70 120 75 140" 
                      fill="none" stroke="#E8E0D5" stroke-width="12" stroke-linecap="round"/>
                <circle cx="75" cy="115" r="7" fill="none" stroke="#FFD700" stroke-width="2" class="bangle"/>
                <circle cx="75" cy="125" r="7" fill="none" stroke="#FFD700" stroke-width="2" class="bangle"/>
                
                <path d="M175 100 C185 110 190 120 185 140" 
                      fill="none" stroke="#E8E0D5" stroke-width="12" stroke-linecap="round"/>
                <circle cx="185" cy="115" r="7" fill="none" stroke="#FFD700" stroke-width="2" class="bangle"/>
                <circle cx="185" cy="125" r="7" fill="none" stroke="#FFD700" stroke-width="2" class="bangle"/>
                
                <!-- Legs with pleated bottom -->
                <path d="M110 160 C110 180 110 190 115 210" 
                      fill="none" stroke="#E8E0D5" stroke-width="15" stroke-linecap="round"/>
                <path d="M150 160 C150 180 150 190 145 210" 
                      fill="none" stroke="#E8E0D5" stroke-width="15" stroke-linecap="round"/>
            </g>
        </svg>
        <!-- Kannappan the Capybara (Male) -->
        <svg class="mascot capybara" viewBox="0 0 240 240">
            <!-- Speech Bubble -->
            <g class="speech-bubble" opacity="0">
                <path d="M20 40 L280 40 Q320 40 320 80 L320 160 Q320 200 280 200 L20 200 Q-20 200 -20 160 L-20 80 Q-20 40 20 40Z" 
                    fill="white" stroke="#21618C" stroke-width="3"/>
                <path d="M150 200 L130 230 L170 200" fill="white" stroke="#21618C" stroke-width="3"/>
                <text x="150" y="90" text-anchor="middle" class="speech-text primary-text" fill="#21618C" font-size="24">കൊള്ളാം!</text>
                <text x="150" y="130" text-anchor="middle" class="speech-text secondary-text" fill="#21618C" font-size="20">നന്നായി ചെയ്തു</text>
                <text x="150" y="170" text-anchor="middle" class="speech-text motivation-text" fill="#21618C" font-size="18">Great job!</text>
            </g>
            
            <!-- Head with masculine features -->
            <g class="capybara-head">
                <!-- Main head shape with stronger jaw -->
                <path d="M100 60
                        C100 30 160 30 160 60
                        C160 90 100 90 100 60Z" 
                    fill="#8B4513" stroke="#6B3410" stroke-width="2"/>
                
                <!-- Ears -->
                <circle cx="105" cy="45" r="12" fill="#8B4513" stroke="#6B3410" stroke-width="2"/>
                <circle cx="155" cy="45" r="12" fill="#8B4513" stroke="#6B3410" stroke-width="2"/>
                
                <!-- Face with masculine features -->
                <g class="mascot-face">
                    <!-- Thicker eyebrows -->
                    <path d="M115 48 L125 48" stroke="#2C1810" stroke-width="3"/>
                    <path d="M135 48 L145 48" stroke="#2C1810" stroke-width="3"/>
                    
                    <!-- Eyes -->
                    <circle cx="120" cy="55" r="4" fill="#2C1810"/>
                    <circle cx="140" cy="55" r="4" fill="#2C1810"/>
                    <circle cx="122" cy="54" r="1.5" fill="white"/>
                    <circle cx="142" cy="54" r="1.5" fill="white"/>
                    
                    <!-- Small mustache -->
                    <path d="M125 62 Q130 64 135 62" stroke="#2C1810" stroke-width="1"/>
                    
                    <!-- Expressions -->
                    <path class="smile" d="M125 67 Q130 72 135 67" fill="none" stroke="#2C1810" stroke-width="2.5"/>
                    <path class="grin" d="M120 67 Q130 77 140 67" fill="none" stroke="#2C1810" stroke-width="2.5" class="hidden"/>
                    <path class="compassionate" d="M125 70 Q130 67 135 70" fill="none" stroke="#2C1810" stroke-width="2.5" class="hidden"/>
                    <path class="very-happy" d="M120 67 Q130 82 140 67" fill="none" stroke="#2C1810" stroke-width="2.5" class="hidden"/>
                </g>
            </g>

            <!-- Body with traditional Kerala mundu -->
            <g class="capybara-body">
                <!-- Torso with broader shoulders -->
                <path d="M85 100 
                        C85 80 110 70 130 70
                        C150 70 175 80 175 100
                        C175 140 150 160 130 160
                        C110 160 85 140 85 100Z" 
                    fill="#8B4513" stroke="#6B3410" stroke-width="2"/>
                
                <!-- Mundu with single gold border -->
                <path d="M85 130 L175 130" stroke="#FFD700" stroke-width="4"/>
                
                <!-- Stronger arms -->
                <path d="M80 100 C70 110 65 120 70 140" 
                    fill="none" stroke="#8B4513" stroke-width="14" stroke-linecap="round"/>
                <path d="M180 100 C190 110 195 120 190 140" 
                    fill="none" stroke="#8B4513" stroke-width="14" stroke-linecap="round"/>
                
                <!-- Legs -->
                <path d="M110 160 C110 180 110 190 115 210" 
                    fill="none" stroke="#8B4513" stroke-width="15" stroke-linecap="round"/>
                <path d="M150 160 C150 180 150 190 145 210" 
                    fill="none" stroke="#8B4513" stroke-width="15" stroke-linecap="round"/>
            </g>
        </svg>

        <!-- Game Content -->
        <main class="game-content">
            <header class="stats-bar">
                <div class="timer">⏳ <span id="time">30</span>s</div>
                <div class="high-score">🏆 <span id="highScore">0</span></div>
            </header>

            <div class="game-board">
                <div class="level-indicator">
                    Level <span id="level">1</span>
                    <div class="level-stars">⭐</div>
                </div>

                <div class="question-container">
                    <div class="question" id="question">Ready to start?</div>
                    <div class="input-wrapper">
                        <input type="number" id="answer" placeholder="Type your answer here!" class="hidden">
                        <button id="actionButton" class="primary-button">Let's Begin! 🚀</button>
                    </div>
                </div>

                <div class="score-display">
                    <div class="current-score">Score: <span id="score">0</span> 🌟</div>
                    <div class="accuracy">Correct: <span id="accuracy">0</span>% ✨</div>
                </div>
            </div>
        </main>

        <div id="message" class="message"></div>
        <div id="celebration" class="celebration"></div>
    </div>

    <script type="module" src="js/index.js"></script>
    </body>
</html>
